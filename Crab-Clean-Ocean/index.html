<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crab Clean Ocean</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="game-root" aria-label="2D game workspace">
    <canvas id="game-canvas" aria-hidden="true"></canvas>
    <section id="game-over" hidden aria-live="polite">
      <h2 id="end-message">Reef rescued!</h2>
      <p id="end-score">Score: 0</p>
      <button id="restart-button" type="button">Play again</button>
    </section>
  </main>
  <script src="runtime/input.js" defer></script>
  <script src="runtime/pixi-core.js" defer></script>
  <script src="runtime/pixi-assets.js" defer></script>
  <script src="runtime/asset-library.js" defer></script>
  <script src="runtime/sounds.js" defer></script>
  <script src="logic.js" defer></script>
</body>
</html>
