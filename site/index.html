<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoboCrabs Vibe Games</title>
  <meta name="description" content="Games made by kids at DIY.org. Pick one and play!">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦀</text></svg>">
  <style>
    :root {
      --bg: #e0f4ff;
      --bg2: #b9e3fb;
      --card: #ffffff;
      --text: #0f2a44;
      --muted: #4a6580;
      --accent: #ff5a4e;
      --accent-text: #ffffff;
      --ring: #0ea5e9;
      --shadow: 0 6px 18px rgba(15, 42, 68, .14);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1b2b;
        --bg2: #12324d;
        --card: #16314a;
        --text: #eaf6ff;
        --muted: #a7c3da;
        --accent: #ff6b5f;
        --shadow: 0 6px 18px rgba(0, 0, 0, .4);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%) fixed;
    }
    header {
      text-align: center;
      padding: 40px 16px 12px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.4rem);
      letter-spacing: .5px;
    }
    .tagline {
      margin: 10px auto 0;
      max-width: 40rem;
      font-size: 1.15rem;
      color: var(--muted);
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }
    .card {
      display: flex;
      flex-direction: column;
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .play {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 22px 20px 18px;
      color: inherit;
      text-decoration: none;
      transition: transform .15s ease;
    }
    .play:hover { transform: translateY(-3px); }
    .play:focus-visible { outline: 4px solid var(--ring); outline-offset: -4px; border-radius: 20px; }
    .emoji { font-size: 3.2rem; line-height: 1; }
    .cover {
      display: block;
      width: calc(100% + 40px);
      margin: -22px -20px 0;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: var(--bg2);
    }
    .card h2 { margin: 14px 0 6px; font-size: 1.4rem; }
    .desc { margin: 0; color: var(--muted); flex: 1; }
    .creator { margin: 10px 0 0; font-size: .95rem; font-weight: 600; }
    .tag {
      display: inline-block;
      margin-top: 10px;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 700;
      background: var(--bg2);
      color: var(--text);
      align-self: flex-start;
    }
    .button {
      display: block;
      margin-top: 16px;
      padding: 12px;
      border-radius: 14px;
      text-align: center;
      font-weight: 800;
      font-size: 1.15rem;
      background: var(--accent);
      color: var(--accent-text);
    }
    .feedback {
      display: block;
      padding: 12px;
      text-align: center;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      border-top: 1px solid var(--bg2);
    }
    .feedback:hover { background: var(--bg2); }
    footer {
      text-align: center;
      padding: 0 16px 40px;
      color: var(--muted);
    }
    footer a { color: inherit; font-weight: 700; }
    .notice { grid-column: 1 / -1; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1 id="site-title">🦀 RoboCrabs Vibe Games</h1>
    <p class="tagline" id="tagline">Games made by kids at DIY.org. Pick one and play!</p>
  </header>
  <main id="games" aria-live="polite"><p class="notice">Loading games…</p></main>
  <footer id="footer"></footer>
  <script>
    (function () {
      var list = document.getElementById("games");

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
      }

      function feedbackLink(base, gameTitle) {
        // Google Forms "pre-filled link" ends with "=" so the game name can be appended.
        return /=$/.test(base) ? base + encodeURIComponent(gameTitle) : base;
      }

      fetch("games.json", { cache: "no-cache" })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.siteTitle) {
            document.title = data.siteTitle;
            document.getElementById("site-title").textContent = "🦀 " + data.siteTitle;
          }
          if (data.tagline) document.getElementById("tagline").textContent = data.tagline;
          list.textContent = "";

          data.games.forEach(function (game) {
            var card = el("article", "card");
            var play = el("a", "play");
            play.href = game.folder + "/";
            if (game.cover) {
              var img = el("img", "cover");
              img.src = game.cover;
              img.alt = "";
              img.loading = "lazy";
              play.appendChild(img);
            } else {
              play.appendChild(el("div", "emoji", game.emoji));
            }
            play.appendChild(el("h2", "", game.title));
            play.appendChild(el("p", "desc", game.description));
            if (game.creator) play.appendChild(el("p", "creator", "Made by " + game.creator));
            play.appendChild(el("span", "tag", game.renderMode === "3d" ? "3D" : "2D"));
            play.appendChild(el("span", "button", "▶ Play"));
            card.appendChild(play);
            if (data.feedbackUrl) {
              var fb = el("a", "feedback", "💬 Tell us what you think");
              fb.href = feedbackLink(data.feedbackUrl, game.title);
              fb.target = "_blank";
              fb.rel = "noopener";
              card.appendChild(fb);
            }
            list.appendChild(card);
          });

          if (data.feedbackUrl) {
            var footer = document.getElementById("footer");
            footer.appendChild(document.createTextNode("Played a game? "));
            var a = el("a", "", "Send the makers your feedback!");
            a.href = feedbackLink(data.feedbackUrl, "");
            a.target = "_blank";
            a.rel = "noopener";
            footer.appendChild(a);
          }
        })
        .catch(function () {
          list.innerHTML = '<p class="notice">Sorry, the game list could not load. Please refresh the page.</p>';
        });
    })();
  </script>
</body>
</html>
